name: Daily snapshot

on:
  schedule:
    # Hourly. The board includes today so far, so a once-a-day snapshot would
    # show today as empty until the following morning. Each run rewrites
    # latest.json and the current day's dated file.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats from PostHog
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: node scripts/fetch-stats.mjs

      - name: Commit and push
        run: |
          git config user.name "cesarxdesign"
          git config user.email "cesarxdesign@gmail.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "snapshot $(date -u +'%F %H:%M')"
            git push
          fi
