name: Daily snapshot

on:
  schedule:
    # Back to daily now that the page queries api/stats.mjs live on load. This
    # run exists for the dated history archive, and for latest.json to stand in
    # as the page's fallback if the live endpoint is ever unavailable.
    - cron: '0 3,4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats from PostHog
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: node scripts/fetch-stats.mjs

      - name: Commit and push
        run: |
          git config user.name "cesarxdesign"
          git config user.email "cesarxdesign@gmail.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "snapshot $(date -u +%F)"
            git push
          fi
